---
# Ceph refuses quorum when mon clocks drift. host_baseline established NTP
# sync; reconfirm it's still in tolerance before bootstrapping.

- name: "Verify chrony is synchronized"
  ansible.builtin.command: /usr/bin/chronyc tracking
  register: _ceph_chrony
  changed_when: false

- name: "Assert chrony reports Leap status Normal"
  ansible.builtin.assert:
    that: "'Leap status     : Normal' in _ceph_chrony.stdout"
    fail_msg: >-
      chrony is not synchronized on {{ inventory_hostname }} — Ceph
      bootstrap will fail. Fix time sync first (re-run host_baseline
      with --tags baseline-chrony) then retry.

# cephadm does NOT trust the clock — it probes a fixed list of systemd
# unit names for enabled+active, in two layers that both abort the deploy:
# `cephadm bootstrap` prepare_host, and the mgr module's check-host on
# `ceph orch host add` (no skip flag; re-runs every host_check_interval).
# The Leap-status assert above proves the clock is right; this one proves
# cephadm will BELIEVE it. On pure-PTP hosts (chronyd masked, timemaster
# owns chrony) the ptp_timesync role satisfies the probe with a
# chrony.service -> timemaster.service alias. The list deliberately
# mirrors the STRICT check_time_sync of RHCS 7-era cephadm builds, which
# lack timemaster.service; RHCS 9's cephadm (20.x) accepts timemaster
# natively. Probing the older, stricter list means this assert passes on
# every release — via the alias where needed, natively on newer builds.
- name: "Probe the systemd units cephadm accepts as time sync"
  ansible.builtin.command: >-
    systemctl is-active
    chrony.service chronyd.service systemd-timesyncd.service
    ntpd.service ntp.service ntpsec.service openntpd.service
  register: _ceph_timesync_units
  changed_when: false
  failed_when: false

- name: "Assert cephadm's time-sync unit probe will pass"
  ansible.builtin.assert:
    that: "'active' in _ceph_timesync_units.stdout_lines"
    fail_msg: >-
      No systemd unit that cephadm recognizes as time sync is active on
      {{ inventory_hostname }} — cephadm would abort with 'No time
      synchronization is active' even though the clock itself is fine
      (the Leap-status check above passed). On pure-PTP hosts this means
      the chrony.service -> timemaster.service alias is missing: re-run
      stage 40 (ptp_timesync) with ptp_timesync_cephadm_time_sync_alias
      enabled. On NTP hosts, chronyd should simply be running.

# --- stale client-state guard, BOOTSTRAP-NODE EDITION -------------------
# ceph_expand's stale_client_guard short-circuits once /etc/ceph/ceph.conf
# exists — and on the bootstrap node, bootstrap itself creates that file
# BEFORE ceph_expand runs, so a stale /etc/ceph/rbdmap from a previous
# cluster would never be caught there (field-observed asymmetry: the
# guard fired on the non-bootstrap nodes only). Run the same checks HERE,
# before bootstrap writes the conf. Semantics identical: no ceph.conf yet
# + kernel RBD maps or rbdmap entries = a previous cluster's client state.
- name: "Check for a pre-existing ceph.conf (re-run vs fresh bootstrap)"
  ansible.builtin.stat:
    path: /etc/ceph/ceph.conf
  register: _ceph_pf_conf

- name: "List kernel RBD mappings (fresh bootstrap only)"
  ansible.builtin.find:
    paths: /sys/bus/rbd/devices
    file_type: any
  register: _ceph_pf_rbd
  failed_when: false
  when: not _ceph_pf_conf.stat.exists

- name: "Check for leftover rbdmap entries (fresh bootstrap only)"
  ansible.builtin.shell: |
    set -o pipefail
    grep -Ev '^\s*(#|$)' /etc/ceph/rbdmap 2>/dev/null | wc -l
  args:
    executable: /bin/bash
  register: _ceph_pf_rbdmap
  changed_when: false
  failed_when: false
  when: not _ceph_pf_conf.stat.exists

- name: "Assert no previous cluster's client state on the bootstrap node"
  ansible.builtin.assert:
    that:
      - ((_ceph_pf_rbd.files | default([])) | length) == 0
      - ((_ceph_pf_rbdmap.stdout | default('0') | trim | int)) == 0
    fail_msg: >-
      The bootstrap node carries client state from a previous cluster:
      {{ (_ceph_pf_rbd.files | default([])) | length }} kernel RBD
      mapping(s) and
      {{ _ceph_pf_rbdmap.stdout | default('0') | trim }} rbdmap entr(y/ies)
      — with no current ceph.conf. A stale mapping against a destroyed
      cluster is reboot-only (D-state); stale rbdmap entries resurrect it
      on the next boot. Unmap / clear /etc/ceph/rbdmap (and disable
      rbdmap.service if unused), then re-run. Rule: client artifacts come
      OFF while the cluster is still alive (docs/TROUBLESHOOTING.md).
  when: not _ceph_pf_conf.stat.exists

- name: "Find this node's entry in vpac_nodes"
  ansible.builtin.set_fact:
    _ceph_node: "{{ vpac_nodes | selectattr('hostname', 'equalto', inventory_hostname) | first }}"

- name: "Verify this node's storage IP is bound to an interface"
  ansible.builtin.command: "/usr/sbin/ip -4 -o addr show"
  register: _ceph_ip
  changed_when: false

- name: "Assert storage_ip is present on some interface"
  ansible.builtin.assert:
    that: _ceph_node.storage_ip in _ceph_ip.stdout
    fail_msg: >-
      storage_ip {{ _ceph_node.storage_ip }} is not bound to any interface
      on {{ inventory_hostname }}. Has the networking role run cleanly?
