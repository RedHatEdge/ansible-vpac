---
# Disable services that wake periodically and steal jitter from RT VMs even
# when individual VMs set <nosharepages/> or pin their CPUs:
#   irqbalance — silently fights `isolate_managed_irq=Y` by re-balancing
#                IRQs onto isolated cores
#   ksm        — same-page-merging scanner (CPU work)
#   ksmtuned   — tunes ksm aggressiveness; same problem
#
# Safe to run on non-RT hosts too — none are useful for cluster-node
# workloads. Skipped silently if the unit isn't installed.

- name: "Stop and disable jitter-causing services"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ksm
    - ksmtuned
  failed_when: false
  register: _virt_jitter

# irqbalance is masked, not merely disabled. Stock RHEL ships it ENABLED, so
# `disabled` is a state something has to keep putting the host back into: a
# package reinstall or a `systemctl preset` re-enables a disabled unit, and
# cannot re-enable a masked one. It is also the most consequential of these —
# it re-spreads device IRQs across all CPUs and will place a busy NIC queue on
# an isolated RT core, which isolate_managed_irq=Y does not prevent (that only
# holds at device probe time).
#
# Consequence to know: converting a node to a NON-RT role later requires
# `systemctl unmask irqbalance`. That is deliberate — it should take an
# explicit act, not a package update.
- name: "Stop and mask irqbalance"
  ansible.builtin.systemd_service:
    name: irqbalance
    state: stopped
    enabled: false
    masked: true
  failed_when: false

# tuned-ppd (the desktop power-slider shim) silently flips the tuned
# profile back to `balanced` when a GUI stack is present — observed on a
# field host installed "Server with GUI" (RH KB 7127032). Minimal installs
# don't carry it, so this is a no-op there. Mask rather than just disable
# so a later GUI package install cannot re-enable it.
- name: "Mask tuned-ppd (GUI power-slider daemon) if present"
  ansible.builtin.systemd_service:
    name: tuned-ppd
    state: stopped
    enabled: false
    masked: true
  failed_when: false

# Desktop network services that a "Server with GUI" or "Workstation" install
# drags in. These are not merely idle overhead on a protection host:
#
#   avahi-daemon — joins the mDNS multicast group on EVERY interface, which
#                  includes the relay's process-bus macvtap devices, putting
#                  host-originated multicast on the Sampled-Values LANs
#   cups         — print scheduler; cups-browsed additionally browses the
#                  network for printers
#   ModemManager — probes serial devices on appearance
#   wpa_supplicant — wireless supplicant; nothing on a substation host needs it
#
# ⚠ The SOCKET and PATH units matter as much as the services. Disabling
# cups.service alone leaves cups.socket and cups.path armed, and the next
# connection starts it again; the same is true of avahi-daemon.socket. They
# are listed first so activation is removed before the service is stopped.
#
# Masked, not merely disabled, for the same reason as tuned-ppd: a later
# package install or dependency pull must not silently bring them back.
# Minimal/server installs do not carry these units, so this is a no-op there.
#
# The structural fix remains a minimal or server (no GUI) install — this is
# remediation for a host that already has one.
- name: "Stop and mask desktop network services (GUI installs only)"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - avahi-daemon.socket
    - cups.socket
    - cups.path
    - avahi-daemon.service
    - cups.service
    - cups-browsed.service
    - ModemManager.service
    - wpa_supplicant.service
  failed_when: false
  when: virtualization_disable_desktop_services | bool
