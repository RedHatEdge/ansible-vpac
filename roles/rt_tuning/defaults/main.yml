---
# RT package set. kernel-rt is the workhorse; the rest are tuned profiles
# + tools the role uses. kernel-rt-kvm used to be listed here but Red Hat
# stopped keeping its build in sync with kernel-rt's in the NFV repo
# (kernel-rt jumps each minor RHEL release; kernel-rt-kvm lags), so the
# pair regularly fails to depsolve. The KVM-for-RT bits that used to live
# in kernel-rt-kvm are now part of kernel-rt-modules-{core,extra}, which
# kernel-rt itself pulls in.
rt_tuning_packages:
  - kernel-rt
  - tuned-profiles-realtime
  - tuned-profiles-nfv-host
  - realtime-tests
  - dnf-plugins-core
  - python3-dnf-plugin-versionlock
  - intel-cmt-cat            # pqos for cache work; also installed by virtualization

# Effective hugepage count — COMPUTED from the VM catalog unless pinned.
# CANONICAL DERIVATION (mirrored, with sync comments, in
# preflight/tasks/hugepages.yml and validate/tasks/memory.yml — change all
# three together): sum of memory_gb over vm_catalog entries with
# hugepages: true, as 1G pages (×512 for 2M pages);
# rt_tuning.nr_hugepages_override pins an explicit count instead.
# Field defects this encodes:
#   - `default(10)` did NOT catch the inventory's documented explicit
#     null, so the value rendered EMPTY: sysctl errored, and the verify
#     compared empty|int==0 against an unallocated pool == vacuous pass.
#     Every hugepages:true VM was unstartable. default(N, true) semantics
#     via the explicit is-none test below.
#   - an empty catalog now correctly computes 0 (cluster-only path
#     reserves nothing), instead of a silent 10×1GiB default burn.
# The same value feeds BOTH the kernel cmdline (hugepagesz=/hugepages=)
# AND /etc/sysctl.d/vpac-rt.conf vm.nr_hugepages — single source of truth
# (the dual-source bug locked 114 GiB on a documented field deployment).
rt_tuning_hugepages_vm_gb: >-
  {{ vm_catalog | default([])
     | selectattr('hugepages', 'defined') | selectattr('hugepages')
     | map(attribute='memory_gb') | map('int') | sum }}
rt_tuning_nr_hugepages: >-
  {{ (rt_tuning.nr_hugepages_override | int)
     if (rt_tuning.nr_hugepages_override is defined
         and rt_tuning.nr_hugepages_override is not none
         and (rt_tuning.nr_hugepages_override | string | trim | length) > 0)
     else ((rt_tuning_hugepages_vm_gb | int)
           if ((rt_tuning.hugepage_size | default('1G')) == '1G')
           else ((rt_tuning_hugepages_vm_gb | int) * 512)) }}

# RT cmdline additions, beyond what cpu-partitioning emits via tuned.
# Operator can extend or trim; do NOT add selinux=0 — host_baseline
# rejects that (breaks Ceph OSD containers per documented incident).
# hugepagesz= + hugepages= are REQUIRED for 1 GiB pages: they reserve the
# pool at boot. default_hugepagesz= alone reserves NOTHING, and 1 GiB
# pages cannot be reliably allocated at runtime via sysctl (field
# defect: no node ever had a pool despite green runs).
rt_tuning_cmdline_args:
  - "default_hugepagesz={{ rt_tuning.hugepage_size | default('1G') }}"
  - "hugepagesz={{ rt_tuning.hugepage_size | default('1G') }}"
  - "hugepages={{ rt_tuning_nr_hugepages }}"
  - "idle=poll"
  - "intel.max_cstate=0"
  - "intel_idle.max_cstate=0"
  - "processor.max_cstate=0"
  - "processor_idle.max_cstate=0"
  - "intel_pstate=disable"
  - "rdt=cmt,l3cat,l3cdp,mba"
  - "iomem=relaxed"
  - "intel_iommu=on"
  - "iommu=pt"
  - "ipv6.disable=1"

# Toggle to add audit=0 on the cmdline. Suppresses jitter from auditd
# but loses security signal. Default off; flip per-site if RT determinism
# trumps audit requirements.
rt_tuning_disable_audit: false

# Sysctls the role writes to /etc/sysctl.d/vpac-rt.conf.
rt_tuning_nmi_watchdog: 0
# Note: sched_rt_runtime_us = -1 disables RT throttling entirely (RT
# tasks can starve everything else). Set to 950000 (95% of 1s) for
# safer behavior; -1 only when documented relay vendor requires it.
rt_tuning_sched_rt_runtime_us: "{{ rt_tuning.sched_rt_runtime_us | default(-1) }}"

# Reboot after kernel-rt install + cmdline change. Default false so the
# operator schedules reboots; flip true for unattended labs.
rt_tuning_auto_reboot: false

# Whether this host carries relay VMs (rt_chrony settings apply only on
# relay hosts). Default: same set as rt_hosts group membership. Override
# per-host via host_vars when a node is RT-tuned but doesn't run relay
# workloads (e.g. a Windows-passthrough host on RT hardware).
rt_tuning_is_relay_host: "{{ inventory_hostname in groups.get('rt_hosts', []) }}"

# Interfaces whose device IRQs must be force-pinned to the housekeeping
# (non-isolated) CPU set. isolate_managed_irq=Y only holds at device probe
# time; a runtime queue/ring change (tuned netdev_queue_count, `ethtool
# -L/-G`, interface down/up) re-spreads managed IRQs across ALL online CPUs
# and can drop a busy NIC's RX queue + softirq onto an isolated RT core.
# vpac-pin-irqs.service re-pins these after tuned + network settle. Set to
# the process-bus (and any other RT-path) interfaces this host carries,
# e.g. ["ens2f0", "ens2f1"]. Empty => the service is an installed no-op.
rt_tuning_pin_irq_interfaces: "{{ rt_tuning.pin_irq_interfaces | default([]) }}"
