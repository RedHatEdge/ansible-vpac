---
- name: "Skip non-rt_hosts cluster nodes"
  ansible.builtin.meta: end_host
  when: inventory_hostname not in groups.get('rt_hosts', [])

- name: "Install kernel-rt + RT package set + versionlock pattern"
  ansible.builtin.import_tasks: install_rt_kernel.yml
  tags: [rt, rt-install]

- name: "Apply RT cmdline knobs"
  ansible.builtin.import_tasks: cmdline.yml
  tags: [rt, rt-cmdline]

- name: "Write /etc/sysctl.d/vpac-rt.conf (single source of truth for hugepages)"
  ansible.builtin.import_tasks: sysctl.yml
  tags: [rt, rt-sysctl]

- name: "Render realtime-virtual-host-variables.conf BEFORE activating profile"
  ansible.builtin.import_tasks: tuned_profile.yml
  tags: [rt, rt-tuned]

- name: "Mount /sys/fs/resctrl for Intel CAT (pqos)"
  ansible.builtin.import_tasks: intelcat.yml
  tags: [rt, rt-intelcat]

- name: "Pin RT-scoped NIC IRQs to housekeeping (survives tuned/ethtool re-spread)"
  ansible.builtin.import_tasks: irq_affinity.yml
  tags: [rt, rt-irq]

# REPO RULE — any component touching chrony must handle the pure-PTP case:
# stage 40 MASKS system chronyd on timemaster hosts (PTP mode + a dedicated
# PTP NIC) and timemaster supervises its own embedded chronyd. On those
# hosts /etc/chrony.conf is dead config, chronyd cannot be restarted (unit
# masked), and restarting it directly would fight the supervisor even if it
# could be. The rt_chrony values (lock_all/sched_priority/combinelimit) are
# already rendered into timemaster.conf by ptp_timesync from the same
# rt_chrony.* inventory keys — so on timemaster hosts this import is
# redundant BY DESIGN and is skipped. It remains effective on NTP-mode
# hosts and NTP-follower hosts (no PTP NIC), which keep system chronyd.
- name: "RT chrony overrides (hosts where system chronyd is in charge)"
  ansible.builtin.import_tasks: rt_chrony.yml
  when:
    - rt_tuning_is_relay_host | bool
    - >-
      not ((time_sync.mode | default('ntp')) in ['ptp', 'ptp_with_ntp']
           and (networking_defaults.ptp_nic | default('')) | length > 0)
  tags: [rt, rt-chrony]

- name: "cpufreq governor"
  ansible.builtin.import_tasks: cpufreq.yml
  tags: [rt, rt-cpufreq]

- name: "Verify"
  ansible.builtin.import_tasks: verify.yml
  tags: [rt, rt-verify]
