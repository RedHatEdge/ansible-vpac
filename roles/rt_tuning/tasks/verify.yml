---
# Post-apply assertions. Most only hold AFTER the reboot triggered by
# the cmdline + tuned changes — flush handlers FIRST so a queued reboot
# (rt_tuning_auto_reboot=true) actually fires before we test. With
# auto_reboot=false the reboot stays queued for the operator and these
# assertions still fail on first install — operator re-runs with
# --tags rt-verify after their controlled reboot.

- name: "Flush handlers so a queued reboot fires before verify"
  ansible.builtin.meta: flush_handlers

- name: "Read uname"
  ansible.builtin.command: uname -r
  register: _rt_uname
  changed_when: false

- name: "Assert running kernel ends with +rt"
  ansible.builtin.assert:
    that: _rt_uname.stdout.endswith('+rt')
    fail_msg: >-
      Running kernel is {{ _rt_uname.stdout }} — RT kernel not active.
      Reboot the host (the role notify scheduled this) and re-run with
      --tags rt-verify.

- name: "Read active tuned profile"
  ansible.builtin.command: /usr/sbin/tuned-adm active
  register: _rt_tuned
  changed_when: false

- name: "Assert tuned profile is realtime-virtual-host"
  ansible.builtin.assert:
    that: "'realtime-virtual-host' in _rt_tuned.stdout"
    fail_msg: >-
      Active tuned profile is {{ _rt_tuned.stdout | trim }}; expected
      realtime-virtual-host.

- name: "Read kernel-isolated CPUs"
  ansible.builtin.slurp:
    src: /sys/devices/system/cpu/isolated
  register: _rt_isolated

- name: "Assert isolated_cpus matches inventory"
  ansible.builtin.assert:
    that: (_rt_isolated.content | b64decode | trim) == rt_tuning.isolated_cpus
    fail_msg: >-
      /sys/devices/system/cpu/isolated reads
      "{{ _rt_isolated.content | b64decode | trim }}", expected
      "{{ rt_tuning.isolated_cpus }}". Variables-file ordering bug
      (documented field deployment Bug #5) is a known cause.

- name: "Read sched_rt_runtime_us"
  ansible.builtin.slurp:
    src: /proc/sys/kernel/sched_rt_runtime_us
  register: _rt_sched_runtime

- name: "Assert sched_rt_runtime_us matches inventory"
  ansible.builtin.assert:
    that: (_rt_sched_runtime.content | b64decode | trim) == (rt_tuning_sched_rt_runtime_us | string)
    fail_msg: >-
      /proc/sys/kernel/sched_rt_runtime_us is
      {{ _rt_sched_runtime.content | b64decode | trim }}, expected
      {{ rt_tuning_sched_rt_runtime_us }}.

# Hugepage verification — non-vacuous and staged/applied-aware. Field
# defect: the old one-shot compared an EMPTY expected value (|int -> 0)
# against an unallocated pool (0) and passed while every hugepages VM was
# unstartable. Now: the expectation must render to a real integer, and the
# strict pool comparison only runs on a kernel whose cmdline carries the
# expected reservation (1G pools exist only after the post-stage-50
# reboot); pre-reboot we assert the args are STAGED on the default entry.
- name: "Assert the hugepage expectation itself is a valid integer"
  ansible.builtin.assert:
    that:
      - (rt_tuning_nr_hugepages | string | trim | length) > 0
      - (rt_tuning_nr_hugepages | string | trim) is match('^[0-9]+$')
    fail_msg: >-
      rt_tuning_nr_hugepages rendered as
      '{{ rt_tuning_nr_hugepages }}' — not a number. Check
      rt_tuning.nr_hugepages_override and the vm_catalog memory_gb values.

- name: "Read /proc/meminfo HugePages_Total"
  ansible.builtin.shell: "grep '^HugePages_Total:' /proc/meminfo | awk '{print $2}'"
  register: _rt_huge_total
  changed_when: false

- name: "Read running kernel cmdline"
  ansible.builtin.command: cat /proc/cmdline
  register: _rt_proc_cmdline
  changed_when: false

- name: "Assert HugePages_Total matches expectation (applied kernel)"
  ansible.builtin.assert:
    that: (_rt_huge_total.stdout | int) == (rt_tuning_nr_hugepages | int)
    fail_msg: >-
      HugePages_Total is {{ _rt_huge_total.stdout }}, expected
      {{ rt_tuning_nr_hugepages }} — the running kernel carries the
      reservation args but the pool did not materialize. Check for
      fragmentation messages in dmesg and that hugepagesz= matches
      Hugepagesize in /proc/meminfo.
  when: ("hugepages=" ~ (rt_tuning_nr_hugepages | string)) in _rt_proc_cmdline.stdout

- name: "Note: hugepage reservation staged, applies at next reboot"
  ansible.builtin.debug:
    msg: >-
      Expected hugepages={{ rt_tuning_nr_hugepages }} is staged on the boot
      entry but the RUNNING kernel does not carry it yet — the pool
      (currently {{ _rt_huge_total.stdout }}) materializes after the
      rolling reboot (op-rolling-reboot.yml).
  when:
    - (rt_tuning_nr_hugepages | int) > 0
    - ("hugepages=" ~ (rt_tuning_nr_hugepages | string)) not in _rt_proc_cmdline.stdout
