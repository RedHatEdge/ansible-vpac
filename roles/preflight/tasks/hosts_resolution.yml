---
# Assert every cluster hostname (mgmt + storage variants) resolves to the
# expected IP, and that each declared hostname appears on exactly one line
# in /etc/hosts. The silent-failure mode this defends against: two entries
# accidentally concatenated onto a single line, where the kernel returns
# the first match and node2's hostname silently resolves to node1's IP.
# Live migration and Ceph both depend on hostname URIs.
#
# Use `getent ahosts`, NOT `getent hosts`. For the node's OWN hostname the
# `myhostname` NSS module (default in nsswitch.conf on RHEL) synthesises the
# interface link-local addresses and wins the `hosts` database, so
# `getent hosts <self>` returns fe80::... and the assert below fails even
# though /etc/hosts is perfectly correct. `ahosts` does proper address-family
# sorting and returns the IPv4 mgmt address. Cross-node lookups work either
# way -- this only bites on the local hostname, which is why it looks random.

- name: "Forward resolution: mgmt hostnames"
  ansible.builtin.command: "getent ahosts {{ item.hostname }}"
  loop: "{{ vpac_nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
  register: _preflight_resolve_mgmt
  changed_when: false
  failed_when: false

- name: "Assert mgmt-hostname resolution returns the expected mgmt_ip"
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.item.mgmt_ip in (item.stdout | default(''))
    fail_msg: >-
      getent ahosts {{ item.item.hostname }} returned '{{ item.stdout | default('(no answer)') }}';
      expected to contain mgmt_ip {{ item.item.mgmt_ip }}. /etc/hosts may have entries
      concatenated onto one line (silent failure mode), or DNS is misconfigured.
  loop: "{{ _preflight_resolve_mgmt.results }}"
  loop_control:
    label: "{{ item.item.hostname }}"

- name: "Forward resolution: storage-network hostnames (<host>-storage)"
  ansible.builtin.command: "getent ahosts {{ item.hostname }}-storage"
  loop: "{{ vpac_nodes }}"
  loop_control:
    label: "{{ item.hostname }}-storage"
  register: _preflight_resolve_storage
  changed_when: false
  failed_when: false

- name: "Assert storage-hostname resolution returns the expected storage_ip"
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.item.storage_ip in (item.stdout | default(''))
    fail_msg: >-
      getent ahosts {{ item.item.hostname }}-storage returned '{{ item.stdout | default('(no answer)') }}';
      expected to contain storage_ip {{ item.item.storage_ip }}.
      {% if '.' in item.item.hostname %}CAUSE: '{{ item.item.hostname }}' is an
      FQDN — vpac_nodes hostnames must be SHORT names (site_domain is appended
      automatically), so the -storage alias was glued onto the TLD. Fix the
      hostname in the inventory; host_baseline is healthy.
      {% else %}If /etc/hosts already carries <short>-storage entries under a
      different spelling, the inventory hostname does not match the node's —
      align them. Otherwise re-run stage 10 (host_baseline populates these
      entries; required for live migration and Ceph private mons).{% endif %}
  loop: "{{ _preflight_resolve_storage.results }}"
  loop_control:
    label: "{{ item.item.hostname }}-storage"

- name: "Read /etc/hosts to verify entry-per-line discipline"
  ansible.builtin.slurp:
    src: /etc/hosts
  register: _preflight_hosts_file

- name: "Assert each cluster hostname appears on exactly one line in /etc/hosts"
  ansible.builtin.assert:
    that:
      - >-
        ((_preflight_hosts_file.content | b64decode).split('\n')
         | select('search', '(^|\\s)' ~ item.hostname ~ '(\\s|$)') | list | length) == 1
    fail_msg: >-
      Hostname {{ item.hostname }} appears on either zero or multiple lines in /etc/hosts.
      If two entries got concatenated onto one line, hostname resolution breaks silently —
      one node's hostname may resolve to another node's IP. Inspect /etc/hosts and split
      entries onto separate lines.
  loop: "{{ vpac_nodes }}"
  loop_control:
    label: "{{ item.hostname }}"
