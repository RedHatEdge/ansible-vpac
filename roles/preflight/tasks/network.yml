---
# Network checks: mix of per-host (NIC existence) and run_once (CIDR overlaps).

- name: "Assert mgmt and heartbeat CIDRs do not overlap (3+ node clusters)"
  ansible.builtin.assert:
    that: networks.mgmt.cidr != networks.heartbeat.cidr
    fail_msg: >-
      networks.mgmt.cidr and networks.heartbeat.cidr are identical ({{ networks.mgmt.cidr }}).
      Corosync heartbeats must not share a bridge with VM management traffic — see
      LEARNED-FIXES: bridge churn from guest VMs starves corosync under load.
      Assign a dedicated CIDR to networks.heartbeat.
  when: vpac_nodes | length >= 3
  run_once: true

- name: "Warn if heartbeat and storage CIDRs overlap (acceptable but not ideal)"
  ansible.builtin.debug:
    msg: >-
      networks.heartbeat.cidr and networks.storage.cidr are both {{ networks.heartbeat.cidr }}.
      Acceptable — storage is L2-only and not subject to guest bridge churn — but a
      dedicated heartbeat network is preferred for production.
  when:
    - networks.heartbeat.cidr == networks.storage.cidr
    - vpac_nodes | length >= 3
  run_once: true

- name: "Assert mgmt bond members exist on this host"
  ansible.builtin.assert:
    that: item in ansible_facts['interfaces']
    fail_msg: >-
      mgmt_bond member {{ item }} is not an interface on {{ inventory_hostname }}.
      Known interfaces: {{ ansible_facts['interfaces'] | sort | join(', ') }}
  loop: "{{ networking_defaults.mgmt_bond.members }}"

- name: "Assert storage bond members exist on this host"
  ansible.builtin.assert:
    that: item in ansible_facts['interfaces']
    fail_msg: >-
      storage_bond member {{ item }} is not an interface on {{ inventory_hostname }}.
      Known interfaces: {{ ansible_facts['interfaces'] | sort | join(', ') }}
  loop: "{{ networking_defaults.storage_bond.members }}"

- name: "Assert station bond members exist on this host"
  ansible.builtin.assert:
    that: item in ansible_facts['interfaces']
    fail_msg: >-
      station_bond member {{ item }} is not an interface on {{ inventory_hostname }}.
      Known interfaces: {{ ansible_facts['interfaces'] | sort | join(', ') }}
  loop: "{{ networking_defaults.station_bond.members }}"

- name: "Assert declared heartbeat NIC exists on this host (dedicated mode)"
  ansible.builtin.assert:
    that: networking_defaults.heartbeat_nic in ansible_facts['interfaces']
    fail_msg: >-
      networking_defaults.heartbeat_nic ({{ networking_defaults.heartbeat_nic }}) is not
      an interface on {{ inventory_hostname }}. Known interfaces:
      {{ ansible_facts['interfaces'] | sort | join(', ') }}
  when:
    - vpac_nodes | length >= 3
    - not (networking_heartbeat_shared | bool)
    - (networking_defaults.heartbeat_nic | default('')) | length > 0

- name: "Validate shared heartbeat-on-VLAN config (shared mode)"
  ansible.builtin.assert:
    that:
      - (networking_heartbeat_bond_name | default('')) | length > 0
      - networks.heartbeat.vlan is not none
      - (networks.heartbeat.vlan | int) > 0
    fail_msg: >-
      networks.heartbeat.shared_bond is set ({{ networking_heartbeat_shared_bond_role }}) but the
      shared-heartbeat config is incomplete: resolved bond '{{ networking_heartbeat_bond_name }}',
      vlan '{{ networks.heartbeat.vlan | default("unset") }}'. Shared mode needs a resolvable bond
      (storage|mgmt|station or a bond ifname) AND a non-null networks.heartbeat.vlan on its own subnet.
    success_msg: >-
      Heartbeat rides VLAN {{ networks.heartbeat.vlan }} on bond
      {{ networking_heartbeat_bond_name }} ({{ networking_heartbeat_shared_bond_role }}) — shared mode.
  when:
    - vpac_nodes | length >= 3
    - networking_heartbeat_shared | bool
  run_once: true

- name: "Warn if heartbeat shares the mgmt bond (storage bond preferred)"
  ansible.builtin.debug:
    msg: >-
      networks.heartbeat.shared_bond resolves to the management bond
      ({{ networking_heartbeat_bond_name }}). The storage bond is preferred — it is L2-only and
      not subject to the guest-bridge churn that can starve corosync. Note the mgmt/heartbeat CIDR
      assert above still applies: the ring must be a distinct network.
  when:
    - networking_heartbeat_shared | bool
    - networking_heartbeat_bond_name == (networking_defaults.mgmt_bond.name | default(''))
  run_once: true

- name: "Warn when NO heartbeat interface is configured (3+ node cluster)"
  ansible.builtin.debug:
    msg: >-
      No heartbeat interface configured — neither a dedicated networking_defaults.heartbeat_nic
      nor a shared networks.heartbeat.shared_bond. Fine for lab bring-up of stages 10–60, but
      stage 70 (pacemaker_base) binds each node's corosync ring to its heartbeat_ip and needs that
      address present. Configure one (dedicated NIC or shared VLAN) before stage 70.
  when:
    - vpac_nodes | length >= 3
    - networking_skip_heartbeat | bool
