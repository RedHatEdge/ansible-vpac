---
# Cluster property baselines + VirtualDomain resource defaults. All run
# once from the bootstrap node; pacemaker propagates to every node via
# the CIB. The role leaves stonith-enabled=false as a deliberate
# end-state handoff to the stonith role, which flips it true after
# fence devices are configured.

- name: "Set default resource-stickiness via resource defaults"
  # In modern pcs (0.11+, RHEL 9), `default-resource-stickiness` is no
  # longer a CLUSTER property — it's a RESOURCE meta-attribute default
  # set via `pcs resource defaults update resource-stickiness=N`. The
  # old `pcs property set default-resource-stickiness=...` form errors
  # with "invalid cluster property option".
  ansible.builtin.command:
    cmd: "pcs resource defaults update resource-stickiness={{ pacemaker_default_resource_stickiness }}"
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  changed_when: true

- name: "Set cluster-recheck-interval"
  ansible.builtin.command:
    cmd: "pcs property set cluster-recheck-interval={{ pacemaker_cluster_recheck_interval }}"
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  changed_when: true

- name: "Set no-quorum-policy explicitly"
  ansible.builtin.command:
    cmd: "pcs property set no-quorum-policy={{ pacemaker_no_quorum_policy }}"
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  changed_when: true

# stonith-enabled=false is a BOOTSTRAP-ONLY setting: the fresh cluster has
# no fence devices yet, and leaving stonith enabled would block resources
# until stage 75 arms fencing. But it must NEVER run once fence devices
# exist — re-running stage 70 on a fenced cluster (idempotency check,
# adding a node, full site.yml re-run: all normal operator behaviour)
# would otherwise SILENTLY UNFENCE a live cluster while `pcs status`
# still shows every fence resource Started. Field-reproduced. Gate on the
# CIB, same first-run-only shape as `pcs cluster setup`.
- name: "Check whether fence devices already exist in the CIB"
  ansible.builtin.command:
    cmd: pcs stonith config
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  register: _pm_stonith_cfg
  changed_when: false
  failed_when: false

- name: "Disable stonith (bootstrap only — stage 75 flips it true and owns it thereafter)"
  ansible.builtin.command:
    cmd: "pcs property set stonith-enabled=false"
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  changed_when: true
  when: (_pm_stonith_cfg.stdout | default('') | trim | length) == 0

- name: "Note: fencing already armed — stonith-enabled left untouched"
  ansible.builtin.debug:
    msg: >-
      Fence devices exist in the CIB (stage 75 has run) — skipping the
      bootstrap stonith-enabled=false. This re-run will not unfence the
      cluster.
  run_once: true
  when: (_pm_stonith_cfg.stdout | default('') | trim | length) > 0

- name: "Set resource defaults (migration-threshold + failure-timeout)"
  ansible.builtin.command:
    cmd: >-
      pcs resource defaults update
      migration-threshold={{ pacemaker_migration_threshold }}
      failure-timeout={{ pacemaker_failure_timeout }}
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  changed_when: true

- name: "Set resource op defaults (timeout for VirtualDomain ops)"
  ansible.builtin.command:
    cmd: >-
      pcs resource op defaults update
      timeout={{ pacemaker_virtualdomain_op_timeout }}
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  changed_when: true
