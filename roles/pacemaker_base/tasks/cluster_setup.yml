---
# `pcs cluster setup` is NOT idempotent — re-running on an existing cluster
# errors with "Cluster is already configured." Gate on the absence of
# /etc/corosync/corosync.conf on the bootstrap node so re-runs of the role
# skip setup and only run start + enable + properties.
#
# Each node's ring address is its heartbeat_ip from vpac_nodes — pcs
# 0.11+ syntax is `<hostname> addr=<addr>` (two positional args per
# node), NOT the older `<hostname>=<addr>` form (rejected with "Invalid
# character '=' in node name"). This binds corosync to the dedicated
# heartbeat network instead of letting it bind to whatever interface
# resolves <hostname> in /etc/hosts (which would be the mgmt network on
# many clusters — the documented split-brain root cause).

- name: "Stat /etc/corosync/corosync.conf on the bootstrap node"
  ansible.builtin.stat:
    path: /etc/corosync/corosync.conf
  register: _pm_corosync_conf
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true

- name: "Compose '<hostname> addr=<heartbeat_ip>' args for pcs cluster setup"
  ansible.builtin.set_fact:
    _pm_node_args: >-
      {{ vpac_nodes
         | map(attribute='hostname')
         | zip(vpac_nodes | map(attribute='heartbeat_ip'))
         | map('join', ' addr=')
         | join(' ') }}
  run_once: true

# When setup is SKIPPED (conf exists), the existing cluster must BE the
# contract's cluster. Field incident: a teardown stopped the old cluster
# but never destroyed its config; the role correctly skipped the
# non-idempotent setup and stage 70 went green against the WRONG cluster
# — contract said one name, pcs status said another, and nothing
# reported the divergence. Survives-teardown class, fifth member
# (corosync.conf/CIB), and worse than the others: it is silent and a
# DIFFERENT site's contract would silently manage the wrong cluster.
- name: "Read the existing cluster's name (skip path only)"
  ansible.builtin.command:
    cmd: >-
      awk -F': ' '/^\s*cluster_name:/ {print $2; exit}'
      /etc/corosync/corosync.conf
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  register: _pm_existing_name
  changed_when: false
  when: _pm_corosync_conf.stat.exists

- name: "Assert the existing cluster IS the contract's cluster"
  ansible.builtin.assert:
    that: (_pm_existing_name.stdout | trim) == (pacemaker.cluster_name | string)
    fail_msg: >-
      /etc/corosync/corosync.conf already exists and names cluster
      '{{ _pm_existing_name.stdout | trim }}', but this inventory's
      pacemaker.cluster_name is '{{ pacemaker.cluster_name }}'. Cluster
      setup would be SKIPPED (it is not idempotent) and you would be
      silently managing a DIFFERENT cluster than your contract declares.
      Either this host carries a previous deployment — destroy it
      deliberately (`pcs cluster destroy --all` from any member, then
      verify corosync.conf and the CIB are gone on every node) — or your
      cluster_name is wrong for this site. Nothing was changed.
  run_once: true
  when: _pm_corosync_conf.stat.exists

- name: "pcs cluster setup (first run only)"
  ansible.builtin.command:
    cmd: >-
      pcs cluster setup {{ pacemaker.cluster_name }} {{ _pm_node_args }}
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  when: not _pm_corosync_conf.stat.exists
  changed_when: true

- name: "pcs cluster start --all"
  ansible.builtin.command:
    cmd: pcs cluster start --all
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  changed_when: true

- name: "pcs cluster enable --all (so cluster auto-starts on reboot)"
  # Without this, corosync + pacemaker land active/disabled by default
  # — any node reboot orphans the cluster stack. Documented root cause
  # discovered after a multi-node cold-start incident.
  ansible.builtin.command:
    cmd: pcs cluster enable --all
  delegate_to: "{{ vpac_nodes[0].hostname }}"
  run_once: true
  changed_when: true
