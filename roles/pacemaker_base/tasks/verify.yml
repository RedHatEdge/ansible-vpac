---
# Corosync membership takes tens of seconds to converge after
# `pcs cluster start --all` — a one-shot assert here fires while the stack
# reports "Stack: unknown / Current DC: NONE" and every greenfield first
# run fails, then the identical second run passes (field-reproduced with
# timestamps: assert fired ~6s in, membership settled at ~21s). Poll until
# quorum forms and every node is online, THEN assert for message quality.
- name: "Wait for cluster membership to settle (poll pcs status)"
  ansible.builtin.command:
    cmd: pcs status
  register: _pm_status
  changed_when: false
  failed_when: false
  until:
    - "'OFFLINE' not in _pm_status.stdout"
    - "'partition with quorum' in _pm_status.stdout"
  retries: "{{ (pacemaker_verify_settle_timeout_s | default(120) | int) // 5 }}"
  delay: 5

- name: "Assert the cluster settled: quorum formed, no node OFFLINE"
  ansible.builtin.assert:
    that:
      - "'OFFLINE' not in _pm_status.stdout"
      - "'partition with quorum' in _pm_status.stdout"
    fail_msg: >-
      The cluster did not converge within
      ~{{ pacemaker_verify_settle_timeout_s | default(120) }}s of starting —
      a node is OFFLINE or quorum never formed. Check corosync on the
      heartbeat network (`corosync-cfgtool -s` on each node — links must be
      on the heartbeat addresses), pcsd on every node, and firewalld. Last
      pcs status:
      {{ _pm_status.stdout }}

- name: "Assert no pending fencing actions"
  ansible.builtin.assert:
    that: "'pending fencing' not in (_pm_status.stdout | lower)"
    fail_msg: >-
      pcs status reports pending fencing actions; use the
      /usr/local/sbin/pcs-stonith-confirm-helper script to clear them
      before re-running pacemaker_base.

- name: "corosync-cfgtool ring binding"
  ansible.builtin.command:
    cmd: corosync-cfgtool -s
  register: _pm_ring
  changed_when: false

- name: "Capture this node's expected heartbeat IP from inventory"
  ansible.builtin.set_fact:
    _pm_my_heartbeat_ip: >-
      {{ (vpac_nodes | selectattr('hostname', 'equalto', inventory_hostname) | first).heartbeat_ip }}

- name: "Assert corosync ring binds to this node's heartbeat IP"
  ansible.builtin.assert:
    that: _pm_my_heartbeat_ip in _pm_ring.stdout
    fail_msg: >-
      corosync ring is NOT bound to this node's heartbeat IP
      ({{ _pm_my_heartbeat_ip }}). It probably resolved a non-heartbeat
      interface from /etc/hosts. Output:
      {{ _pm_ring.stdout }}
