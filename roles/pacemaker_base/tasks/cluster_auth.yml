---
# `pcs host auth` from one node distributes auth tokens to every node
# listed. Running it from each node creates token thrash. The pattern is
# delegate_to + run_once so it executes exactly once on the first node
# from vpac_nodes and pcs handles the propagation.

# no_log carries the hacluster password; the rescue keeps a failure from
# being a censored dead end.
- name: "pcs host auth all cluster nodes (run once on the bootstrap node)"
  block:
    - name: "pcs host auth all cluster nodes (run once on the bootstrap node)"
      ansible.builtin.command:
        cmd: >-
          pcs host auth
          {{ vpac_nodes | map(attribute='hostname') | join(' ') }}
          -u hacluster
          -p {{ pacemaker.hacluster_password }}
      delegate_to: "{{ vpac_nodes[0].hostname }}"
      run_once: true
      no_log: true
      changed_when: true
  rescue:
    - name: "Explain the hidden cluster-auth failure"
      run_once: true
      ansible.builtin.fail:
        msg: >-
          `pcs host auth` failed (output hidden — the command carries the
          hacluster password). Check on every node: pcsd running
          (`systemctl status pcsd`) and port 2224 reachable between nodes;
          hacluster password set consistently (stage 70 sets it from
          pacemaker.hacluster_password — has that task run on all nodes?);
          hostnames resolving to the heartbeat/mgmt addresses you expect
          (`pcs host auth` uses the names as given); /var/log/pcsd/ on the
          delegate node ({{ vpac_nodes[0].hostname }}).
