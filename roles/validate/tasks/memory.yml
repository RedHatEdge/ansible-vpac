---
# validate/memory — hugepages, MemAvailable, swap activity.
#
# The dual-source-of-truth hugepage bug (cmdline default_hugepagesz vs
# sysctl vm.nr_hugepages drifting apart) burns hosts months after deploy
# when one side gets edited without the other. This is the late-cycle
# check.

- name: "validate-memory"
  block:

    - name: "Read /proc/meminfo"
      ansible.builtin.slurp:
        src: /proc/meminfo
      register: _vm_meminfo

    # Extract only the fields this check consumes. The previous
    # parse-everything-into-a-dict version crashed on every host: inside a
    # block scalar, '\n' reaches Jinja as backslash-n, so the split never
    # happened, the whole file stayed one element, and dict() blew up
    # ("element #0 has length 1"). (?m) + literal-space patterns avoid the
    # backslash-escaping ambiguity entirely.
    - name: "Extract HugePages_Total and MemAvailable"
      ansible.builtin.set_fact:
        _vm_hp_total: >-
          {{ _vm_meminfo.content | b64decode
             | regex_search('(?m)^HugePages_Total: +([0-9]+)', '\1') | first }}
        _vm_mem_avail_kb: >-
          {{ _vm_meminfo.content | b64decode
             | regex_search('(?m)^MemAvailable: +([0-9]+)', '\1') | first }}

    # MIRROR of rt_tuning/defaults derivation — keep in sync. The old
    # fallback chain fell through to an explicit-null override (|int -> 0)
    # and silently skipped this check for the computed-default case.
    - name: "Compute expected hugepage count"
      ansible.builtin.set_fact:
        _val_hp_expected: >-
          {{ (rt_tuning.nr_hugepages_override | int)
             if (rt_tuning.nr_hugepages_override is defined
                 and rt_tuning.nr_hugepages_override is not none
                 and (rt_tuning.nr_hugepages_override | string | trim | length) > 0)
             else (((vm_catalog | default([])
                     | selectattr('hugepages', 'defined') | selectattr('hugepages')
                     | map(attribute='memory_gb') | map('int') | sum) | int)
                   if ((rt_tuning.hugepage_size | default('1G')) == '1G')
                   else (((vm_catalog | default([])
                           | selectattr('hugepages', 'defined') | selectattr('hugepages')
                           | map(attribute='memory_gb') | map('int') | sum) | int) * 512)) }}
      when: rt_tuning is defined

    - name: "Assert HugePages_Total matches inventory budget"
      ansible.builtin.assert:
        that:
          - (_vm_hp_total | int) == (_val_hp_expected | int)
        fail_msg: >-
          HugePages_Total = {{ _vm_hp_total }}, expected
          {{ _val_hp_expected }} — either the post-stage-50 reboot has not
          happened, or the hugepage sources drifted
          (dual-source-of-truth bug class).
      when:
        - rt_tuning is defined
        - (_val_hp_expected | default(0) | int) > 0

    - name: "Assert MemAvailable above floor"
      ansible.builtin.assert:
        that:
          - (_vm_mem_avail_kb | int) >=
            (validate_mem_available_min_gib | int * 1024 * 1024)
        fail_msg: >-
          MemAvailable = {{ (_vm_mem_avail_kb | int) // 1024 }} MiB,
          below {{ validate_mem_available_min_gib }} GiB floor

    - name: "Assert swap is not merely idle but absent"
      ansible.builtin.assert:
        that:
          - (_vm_meminfo.content | b64decode
             | regex_search('SwapTotal:\\s+(\\d+)', '\\1') | first | int) == 0
        fail_msg: >-
          swap is configured and available
          ({{ (_vm_meminfo.content | b64decode
               | regex_search('SwapTotal:\\s+(\\d+)', '\\1') | first | int) // 1024 }} MiB).
          The activity check below only catches swapping that has already
          happened; armed-but-idle swap passes it and can still page a
          latency-critical process out under pressure. Disable it
          persistently: stage 10 does this when
          host_baseline_disable_swap is true.
        success_msg: "no swap configured"
      when: validate_require_no_swap | bool

    - name: "Read swap counters (5s sample)"
      ansible.builtin.shell: vmstat 1 2 | tail -1 | awk '{print $7" "$8}'
      args:
        executable: /bin/bash
      changed_when: false
      register: _vm_swap

    - name: "Assert no swap thrashing (si == so == 0)"
      ansible.builtin.assert:
        that:
          - (_vm_swap.stdout.split() | first | int) == 0
          - (_vm_swap.stdout.split() | last | int) == 0
        fail_msg: >-
          vmstat reports swap activity (si/so) = "{{ _vm_swap.stdout }}"
          — RT determinism gone the moment a relay VM page is paged out

    - name: "Record finding"
      ansible.builtin.set_fact:
        validate_findings: >-
          {{ validate_findings | default([]) +
             [{'check': 'memory', 'status': 'ok',
               'msg': 'HugePages_Total=' ~ _vm_hp_total ~
                      ', MemAvailable=' ~ ((_vm_mem_avail_kb | int) // 1024) ~ 'MiB'}] }}

  rescue:
    - name: "Record finding (fail)"
      ansible.builtin.set_fact:
        validate_findings: >-
          {{ validate_findings | default([]) +
             [{'check': 'memory', 'status': 'fail',
               'msg': ansible_failed_result.msg | default('memory check failed')}] }}
    - name: "Re-raise unless warn_only"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('memory check failed') }}"
      when: not (validate_warn_only | bool)
