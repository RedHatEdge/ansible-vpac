---
# OSDs per `ceph.osd_devices[hostname]`. No auto-discovery — operator's
# inventory is the source of truth (too risky to grab "all unused devices").
#
# Target host MUST be the FQDN that `ceph orch host ls` reports; passing a
# short hostname makes cephadm silently no-op with rc=0.

# ---- Pre-wipe OSD candidate disks ----
# At any reused-hardware site (which is most utility upgrades, replacing
# ESXi / vSAN), every OSD disk has prior partition tables and filesystem
# signatures. Without wipefs + sgdisk, `ceph orch daemon add osd` either
# skips the disk or accepts it with leftovers and the OSD crashloops.
# Refuses to wipe a disk that's currently mounted — operator's safety net.

# --- Never wipe a device that is already an active Ceph OSD ----------
# The mounted-check below does NOT protect OSDs: bluestore devices are LVM
# PVs, never mounted, so lsblk MOUNTPOINT is empty on a healthy in-service
# OSD. Without this guard, the natural operator action — fix a mid-stage-60
# failure and simply re-run — would wipefs 12 in-service OSDs. Detect the
# ceph-volume LVM child ('ceph--…' device-mapper name) and skip those
# devices. Fail-safe direction: worst case is a skipped wipe on genuinely
# stale ceph residue, which the operator resolves deliberately with
# ceph_expand_force_wipe_ceph_devices=true (or a manual wipe) — versus the
# old worst case of destroying live OSD data.
- name: "Detect declared OSD devices already carrying Ceph LVM"
  ansible.builtin.command: "lsblk -no NAME {{ item }}"
  loop: "{{ ceph.osd_devices[inventory_hostname] | default([]) }}"
  register: _ceph_dev_scan
  changed_when: false
  failed_when: false
  when: ceph_expand_wipe_osd_disks | bool

- name: "Partition wipe targets — active Ceph devices are skipped unless forced"
  ansible.builtin.set_fact:
    _ceph_wipe_targets: >-
      {{ (ceph.osd_devices[inventory_hostname] | default([]))
         if (ceph_expand_force_wipe_ceph_devices | bool)
         else (_ceph_dev_scan.results | default([])
               | selectattr('stdout', 'defined')
               | rejectattr('stdout', 'search', 'ceph--')
               | map(attribute='item') | list) }}
    _ceph_wipe_skipped: >-
      {{ [] if (ceph_expand_force_wipe_ceph_devices | bool)
         else (_ceph_dev_scan.results | default([])
               | selectattr('stdout', 'defined')
               | selectattr('stdout', 'search', 'ceph--')
               | map(attribute='item') | list) }}
  when: ceph_expand_wipe_osd_disks | bool

- name: "Report Ceph-held devices excluded from the wipe"
  ansible.builtin.debug:
    msg: >-
      NOT wiping {{ _ceph_wipe_skipped | length }} device(s) on
      {{ inventory_hostname }} that already carry Ceph LVM (likely live OSDs
      from a previous run): {{ _ceph_wipe_skipped | join(', ') }}. This is the
      safe default for re-runs. If these are stale leftovers you intend to
      destroy, set ceph_expand_force_wipe_ceph_devices=true or wipe them
      manually first.
  when:
    - ceph_expand_wipe_osd_disks | bool
    - (_ceph_wipe_skipped | default([])) | length > 0

- name: "Verify each declared OSD device is unmounted before wipe"
  ansible.builtin.command: "lsblk -no MOUNTPOINT {{ item }}"
  loop: "{{ _ceph_wipe_targets | default([]) }}"
  register: _ceph_osd_mounts
  changed_when: false
  when: ceph_expand_wipe_osd_disks | bool

- name: "Assert no declared OSD device is mounted"
  ansible.builtin.assert:
    that: (item.stdout | trim) | length == 0
    fail_msg: >-
      OSD candidate {{ item.item }} is currently mounted at
      '{{ item.stdout | trim }}'. Refusing to wipe. Either unmount it or
      remove it from ceph.osd_devices for this host.
  loop: "{{ _ceph_osd_mounts.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('?') }}"
  when:
    - ceph_expand_wipe_osd_disks | bool
    - _ceph_osd_mounts.results is defined

- name: "wipefs -a + sgdisk --zap-all on each OSD device"
  ansible.builtin.shell: |
    set -e
    wipefs -a {{ item }}
    sgdisk --zap-all {{ item }}
  loop: "{{ _ceph_wipe_targets | default([]) }}"
  register: _ceph_osd_wipe
  changed_when: true
  when: ceph_expand_wipe_osd_disks | bool

- name: "Add OSD on each device declared in ceph.osd_devices for this host"
  # On a freshly-bootstrapped cluster, `ceph orch daemon add osd` can
  # return rc=0 with empty output for the first device on a newly-added
  # host — the orchestrator hasn't finished settling that host's device
  # inventory yet. Retry until cephadm gives us a definitive response:
  # either "Created osd" (success) or "already exists"/"in use"
  # (idempotent skip on re-run). Otherwise the task misses the OSD and
  # we end up short one device.
  ansible.builtin.command: >-
    /usr/bin/ceph orch daemon add osd
    {{ hostvars[inventory_hostname].ansible_fqdn }}:{{ item }}
  # Bounded per invocation: a wedged orchestrator left this exact command
  # blocked for 47+ minutes in the field with no Ansible error. When the
  # ceiling fires the failure is loud and names the host:device.
  timeout: "{{ ceph_expand_orch_call_timeout_s | int }}"
  loop: "{{ ceph.osd_devices[inventory_hostname] | default([]) }}"
  delegate_to: "{{ ceph.bootstrap_node }}"
  register: _ceph_add_osd
  # cephadm's idempotent response is `Created no osd(s) on host <h>;
  # already created?` in STDOUT (not stderr) — the substring 'Created osd'
  # IS present inside 'Created no osd' which would falsely register as a
  # new-OSD success and as a changed-state. Match on 'already created'
  # explicitly, AND require 'Created no osd' NOT to be in the stdout
  # before treating 'Created osd' as a real success.
  changed_when: >-
    ('Created osd' in (_ceph_add_osd.stdout | default(''))) and
    ('Created no osd' not in (_ceph_add_osd.stdout | default('')))
  until:
    - _ceph_add_osd.rc == 0
    - >-
      (('Created osd' in (_ceph_add_osd.stdout | default(''))) and
       ('Created no osd' not in (_ceph_add_osd.stdout | default('')))) or
      ('already created' in (_ceph_add_osd.stdout | default(''))) or
      ('already' in (_ceph_add_osd.stderr | default(''))) or
      ('in use' in (_ceph_add_osd.stderr | default('')))
  retries: 10
  delay: 15

- name: "Wait for OSD count to equal inventory total"
  ansible.builtin.command: /usr/bin/ceph osd stat --format json
  register: _ceph_osd_stat
  delegate_to: "{{ ceph.bootstrap_node }}"
  run_once: true
  changed_when: false
  until:
    - (_ceph_osd_stat.stdout | from_json).num_osds >= (ceph.osd_devices.values() | map('length') | sum)
    - (_ceph_osd_stat.stdout | from_json).num_up_osds >= (ceph.osd_devices.values() | map('length') | sum)
  retries: "{{ (ceph_expand_orch_timeout_s | int) // 10 }}"
  delay: 10
