---
# Create the cephx user libvirt uses to attach RBD volumes, then define a
# libvirt secret on every cluster node holding that user's key.
#
# The libvirt secret UUID MUST be the same on every node — different UUIDs
# silently break live migration (destination has no matching secret).
# Generate once with `uuidgen`, commit to inventory, never change.
#
# Skipped entirely when no RBD pool is declared in ceph.pools[].

- name: "Find RBD pool definitions"
  ansible.builtin.set_fact:
    _ceph_rbd_pools: "{{ ceph.pools | selectattr('type', 'equalto', 'rbd') | list }}"
  run_once: true

- name: "Skip libvirt secret setup when no RBD pools are declared"
  ansible.builtin.meta: end_play
  when: _ceph_rbd_pools | length == 0

# The secret UUID must be identical on every node (different UUIDs silently
# break live migration). It is NOT an operator input: when the inventory
# leaves ceph.libvirt_secret_uuid null (or on the legacy all-zeros
# placeholder), derive it deterministically from the cluster FSID — same
# value on every node and every re-run, zero configuration. An explicit
# non-placeholder inventory value is respected (pin it once, never change
# it after VMs reference it).
- name: "Resolve libvirt secret UUID (derived from FSID unless pinned)"
  ansible.builtin.set_fact:
    _ceph_libvirt_uuid: >-
      {{ ceph.libvirt_secret_uuid
         if ((ceph.libvirt_secret_uuid | default('', true) | length > 0)
             and ceph.libvirt_secret_uuid != '00000000-0000-0000-0000-000000000000')
         else ((ceph_fsid ~ ':vpac-libvirt-rbd-secret') | to_uuid) }}

- name: "Create or get cephx user for libvirt RBD access"
  # map(attribute='name') — the pool entries are dicts; Jinja's attr() does
  # true attribute access only and cannot read dict keys.
  ansible.builtin.command: >-
    /usr/bin/ceph auth get-or-create {{ ceph.libvirt_cephx_user }}
    mon "profile rbd"
    osd "profile rbd pool={{ _ceph_rbd_pools | map(attribute='name') | first }}"
  delegate_to: "{{ ceph.bootstrap_node }}"
  run_once: true
  register: _ceph_libvirt_user
  changed_when: "'created' in (_ceph_libvirt_user.stderr | default('') | lower)"

- name: "Read cephx key for the libvirt user"
  ansible.builtin.command: "/usr/bin/ceph auth print-key {{ ceph.libvirt_cephx_user }}"
  delegate_to: "{{ ceph.bootstrap_node }}"
  run_once: true
  register: _ceph_libvirt_key
  changed_when: false
  no_log: true

- name: "Ensure libvirt secrets directory exists"
  ansible.builtin.file:
    path: /etc/libvirt/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "Render libvirt secret XML"
  ansible.builtin.copy:
    dest: "/etc/libvirt/secrets/{{ _ceph_libvirt_uuid }}.xml"
    owner: root
    group: root
    mode: "0600"
    content: |
      <secret ephemeral='no' private='no'>
        <uuid>{{ _ceph_libvirt_uuid }}</uuid>
        <usage type='ceph'>
          <name>{{ ceph.libvirt_cephx_user }} secret</name>
        </usage>
      </secret>

# The define itself never decides success — the post-state check below
# does. Field-diagnosed: the old substring tolerance ('already defined'
# accepted as the re-run case) could not distinguish "OUR secret already
# exists" (fine) from "a PREVIOUS cluster's secret still holds usage
# '<user> secret'" (fatal — libvirt enforces uniqueness on the USAGE
# NAME, not the UUID, and the UUID is FSID-derived so a new cluster can
# NEVER define its secret while the old one squats on the usage). The
# tolerance reported ok on all three nodes while the define had failed,
# and the play then died two tasks later with a misleading
# 'Secret not found'. Verify by observed state, not the command's text.
- name: "Define libvirt secret"
  ansible.builtin.command: >-
    /usr/bin/virsh secret-define
    /etc/libvirt/secrets/{{ _ceph_libvirt_uuid }}.xml
  register: _ceph_secret_define
  changed_when: _ceph_secret_define.rc == 0
  failed_when: false

- name: "Read the secrets libvirt actually has"
  ansible.builtin.command: /usr/bin/virsh secret-list
  register: _ceph_secret_list
  changed_when: false

- name: "Assert this cluster's secret is genuinely defined"
  ansible.builtin.assert:
    that: _ceph_libvirt_uuid in (_ceph_secret_list.stdout | default(''))
    fail_msg: >-
      libvirt does not have secret {{ _ceph_libvirt_uuid }} after
      secret-define (virsh said: {{ _ceph_secret_define.stderr | default('') | trim }}).
      Most likely a PREVIOUS cluster's secret still occupies the usage
      name '{{ ceph.libvirt_cephx_user }} secret' — libvirt enforces
      uniqueness on the usage name, and cluster removal does not undefine
      it. Currently defined secrets: {{ _ceph_secret_list.stdout | default('') | trim }}.
      Fix: `virsh secret-undefine <old-uuid>` for the stale one on each
      node, then re-run. Rule: undefine the cluster's libvirt secret
      BEFORE destroying the cluster (see docs/TROUBLESHOOTING.md).

# Stage the key to a root-only file, set the secret value from it, and
# ALWAYS shred the file — including on the failure path (a cephx key must
# not persist on disk because an intervening task failed).
#
# no_log placement is deliberate and narrow: it belongs ONLY where secret
# material appears in the task's arguments or registered result. The
# staging task carries the key in `content:` (no_log). The set-value task
# carries only a UUID and a file path — the key is inside the file — so it
# runs WITHOUT no_log: when it fails, the operator must see virsh's actual
# stderr, not a censored blob.
- name: "Set the libvirt secret value (staged key, guaranteed cleanup)"
  block:
    - name: "Stage cephx key for virsh secret-set-value"
      ansible.builtin.copy:
        dest: /root/.vpac-cephx-key.tmp
        content: "{{ _ceph_libvirt_key.stdout | trim }}"
        owner: root
        group: root
        mode: "0400"
      no_log: true

    - name: "Set libvirt secret value from staged key"
      # No --base64 flag: with --file, virsh treats the file content as
      # base64 by DEFAULT (--plain is the opt-out), and `ceph auth
      # print-key` emits base64 — so --file alone is exactly right.
      # (--base64 <value> is the mutually-exclusive inline-argument form;
      # as a bare trailing flag it fails with "expected syntax".)
      ansible.builtin.command: >-
        /usr/bin/virsh secret-set-value
        --secret {{ _ceph_libvirt_uuid }}
        --file /root/.vpac-cephx-key.tmp
      changed_when: true
  always:
    - name: "Shred and remove staged key file (runs even on failure)"
      ansible.builtin.command: /usr/bin/shred -u /root/.vpac-cephx-key.tmp
      args:
        removes: /root/.vpac-cephx-key.tmp
      changed_when: true
