---
# How long to wait for each `ceph orch` operation to report its target
# state — host addition, OSD creation, fs ready, etc.
# The role pre-pulls the ceph image on every node (prepull_image.yml)
# BEFORE any deploy, so orch waits no longer include image pulls. The
# ceiling stays generous because cephadm's own per-command timeout (raised
# by ceph_bootstrap) is the binding constraint, and OUR wait expiring
# early just hides cephadm's more specific error. Bounded on purpose —
# these timeouts are what convert a silent hang into a reported failure.
ceph_expand_orch_timeout_s: 1800

# Max time for the per-node cache-warming image pull. RHCS 9's core image
# is ~1.3 GB per node (larger than RHCS 7); sized for a slow link.
ceph_expand_image_pull_timeout_s: 1800

# How long to wait for HEALTH_OK (or the operator-configured acceptable
# state) at the end of the role. Tuning OSDs on slow disks can make this
# take a while.
ceph_expand_health_timeout_s: 900

# Whether HEALTH_OK is required for the role to succeed. Set false for
# deployments that expect HEALTH_WARN (e.g. insufficient OSDs in a minimal
# lab).
ceph_expand_require_health_ok: true

# fstab mount options for CephFS.
ceph_expand_mount_opts: "noatime,_netdev"

# MON placement count. cephadm's default spec wants 5 mons; on a 3-node
# cluster that leaves `ceph orch ls` permanently showing mon 3/5 — healthy
# but operator-confusing. Default: one mon per node, capped at 5.
ceph_expand_mon_count: "{{ [vpac_nodes | default([]) | length, 5] | min }}"

# Wipe OSD candidate disks (wipefs -a + sgdisk --zap-all) before adding them
# as OSDs. Required at any reused-hardware site; without it, prior partition
# tables and filesystem signatures (ESXi, vSAN, prior Ceph) cause OSD-add to
# either skip the disk or crashloop. Refuses to wipe a disk that is currently
# mounted, and — independently of this toggle — devices that already carry
# Ceph LVM (live OSDs from a previous run) are ALWAYS excluded from the wipe
# unless ceph_expand_force_wipe_ceph_devices is set, so a plain re-run of
# stage 60 cannot destroy an existing cluster's OSDs. Toggle false ONLY for
# greenfield NVMe where you have hand-verified every device is empty.
ceph_expand_wipe_osd_disks: true

# Escape hatch for the guard above: also wipe devices that carry Ceph LVM.
# Set true ONLY when redeploying over a decommissioned cluster whose OSD
# data you intend to destroy (e.g. the RHCS version-bump redeploy). Never
# leave it true in a site inventory.
ceph_expand_force_wipe_ceph_devices: false

# Sanlock-on-RBD lockspace. The role provisions this image in the first
# RBD pool declared in ceph.pools[]. 1 GiB is enough for hundreds of VMs;
# the structure is mostly slot metadata, not data. Name change is not
# supported across re-runs — pick once, never rename.
# Single source of truth is the contract's ceph.sanlock_lockspace_image —
# stage-80 lease paths read the same key, so overriding only this role
# default would silently split the two. Kept as a role var for tag-scoped
# overrides in labs.
ceph_expand_sanlock_lockspace_name: "{{ ceph.sanlock_lockspace_image | default('sanlock-leases') }}"
ceph_expand_sanlock_lockspace_size_mb: 1024
